<!doctype html>
<!-- Four independent 400 x 400 CSS-pixel tiles. Screenshot each .tile at deviceScaleFactor: 1 after document.fonts.ready. Embedded VT323 keeps rendering offline. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JEVPLAY.GAMES TILES</title><style>@font-face {
  font-family: 'VT323';
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url('fonts/VT323-Regular.ttf') format('truetype');
}
:root { --pink:#F386A1; --ink:#1E1E1E; --magenta:#E551BA; --panel:#DEDEDE; --paper:#FEFEFE; }
* { box-sizing:border-box; } body { margin:0; display:grid; grid-template-columns:repeat(2,400px); width:800px; background:var(--pink); color:var(--ink); font-family:'VT323','JetBrains Mono',monospace; }
.tile { width:400px; height:400px; position:relative; overflow:hidden; background:var(--pink); }
.texture { position:absolute; inset:20px; width:360px; height:360px; border:1px solid var(--ink); }
.mark { position:absolute; width:9px; height:9px; border:0 solid var(--ink); } .tl{left:9px;top:9px;border-left-width:1px;border-top-width:1px}.tr{right:9px;top:9px;border-right-width:1px;border-top-width:1px}.bl{left:9px;bottom:9px;border-left-width:1px;border-bottom-width:1px}.br{right:9px;bottom:9px;border-right-width:1px;border-bottom-width:1px}
.tag { position:absolute; left:20px; top:20px; padding:4px 8px; background:var(--ink); color:var(--pink); font-size:18px; letter-spacing:1px; }
.window { position:absolute; left:39px; top:76px; width:320px; height:266px; border:1px solid var(--ink); background:var(--panel); box-shadow:inset 0 0 0 2px var(--paper),3px 3px 0 var(--ink); }
.bar { height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 9px; color:var(--paper); background:var(--ink); font-size:24px; line-height:1; }
.art { display:block; width:318px; height:234px; } svg text { font-family:'VT323','JetBrains Mono',monospace; fill:var(--ink); font-size:22px; } .footer { position:absolute; top:355px; left:40px; right:40px; display:flex; justify-content:space-between; font-size:17px; background:var(--pink); }
</style></head><body>
