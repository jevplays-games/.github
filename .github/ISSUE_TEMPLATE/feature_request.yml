name: Feature or idea
description: Suggest a change to a game, the hub or the Factorio tools.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Which game or tool?
      options:
        - Tic-Tac-Typed (jev-tic-tac-typed)
        - Choice Four (jev-choice-four)
        - Typecheckers (jev-typecheckers)
        - Box Score (jev-box-score)
        - Noul Who (jev-noul-who)
        - Typecrack (jev-typecrack)
        - SafeSweep (jev-safesweep)
        - Typedoku (jev-typedoku)
        - Slide Score (jev-slide-score)
        - Hub at jevplay.games (JevPlay-Games)
        - Factorio agent (jev-factorio-agent)
        - Mission Control overlay (jev-factorio-mission-control)
        - A new game or the organization in general
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change or add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What you ran or measured to support this. If nothing yet, say so.
