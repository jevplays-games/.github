name: Bug report
description: Something in a game, the hub or the Factorio tools does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, Discord tokens or player data. For security problems, use the private "Report a vulnerability" form on the Security tab instead of this form.
  - type: dropdown
    id: game
    attributes:
      label: Which game or tool?
      options:
        - Tic-Tac-Typed (jev-tic-tac-typed)
        - Choice Four (jev-choice-four)
        - Typecheckers (jev-typecheckers)
        - Box Score (jev-box-score)
        - Noul Who (jev-noul-who)
        - Typecrack (jev-typecrack)
        - SafeSweep (jev-safesweep)
        - Typedoku (jev-typedoku)
        - Slide Score (jev-slide-score)
        - Hub at jevplay.games (JevPlay-Games)
        - Factorio agent (jev-factorio-agent)
        - Mission Control overlay (jev-factorio-mission-control)
        - Other
    validations:
      required: true
  - type: dropdown
    id: opponent
    attributes:
      label: Who was the opponent?
      description: Local practice is a labeled mode that is not Jev. Say which one you saw.
      options:
        - Live Jev (with a TypeSafe API key)
        - Local practice (labeled, not Jev)
        - Not applicable
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or inputs. Use local practice or the offline path where the project has one.
      placeholder: |
        1. Run `npm start` (or open the site)
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA, release or deployed site you used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node or Python version, browser and operating system.
  - type: textarea
    id: not-verified
    attributes:
      label: What you did not check
      description: Anything you could not run or confirm, so we do not assume it.
